<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17161d">
    <meta name="description" content="Make a little progress every day. Import, organize, and study your flashcards with confidence-based spaced repetition.">
    <title>Flashlang — Make it stick.</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="dark light">
    <script>
      // Apply the saved device preference before styles load to avoid a bright first frame.
      try { if (localStorage.getItem('flashlang.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#eeedf0' : '#17161d';
    </script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./design.css">
    <link rel="stylesheet" href="./themes.css">
    <script src="./config.js"></script>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"><div class="initial-loader"><span class="loader-mark">f.</span><p>A little space for your next big idea.</p></div></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <noscript>Flashlang needs JavaScript to organize and study your flashcards. Please enable JavaScript in your browser.</noscript>
  </body>
</html>
